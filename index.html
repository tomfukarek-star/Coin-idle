<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coin Idle: Gacha Pools</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#0d0b16;color:#e8e4f5;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
#top{flex:0 0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px 8px;background:linear-gradient(180deg,#171327,#0d0b16)}
#scroll{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 16px}
#nav{flex:0 0 auto;display:flex;background:#151222;border-top:1px solid #2a2540;padding-bottom:env(safe-area-inset-bottom);position:relative;z-index:5}
#nav button{flex:1;background:none;border:0;color:#6f688c;font-size:11px;font-weight:700;min-height:60px;padding:8px 2px;cursor:pointer;font-family:inherit;position:relative}
#nav button.on{color:#b79cf5}
#nav button.on::after{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;background:#8b6ce0;border-radius:0 0 3px 3px}
.dot{position:absolute;top:9px;right:50%;margin-right:-20px;width:7px;height:7px;border-radius:50%;background:#4fbf7a}
h1{font-size:15px;margin:0 0 8px;font-weight:700;letter-spacing:.3px;color:#a99ed0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.stat{font-size:22px;font-weight:800;letter-spacing:-.3px}
.sub{font-size:11px;color:#a79ec9;margin-top:1px}
.right{text-align:right}
.card{background:linear-gradient(160deg,#1c1830,#171326);border:1px solid #2c2644;border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px;gap:8px}
.row span:last-child{color:#c2bade;font-weight:600;text-align:right}
.carousel{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.arrow{background:#241f36;border:1px solid #362e52;color:#cfc7ea;border-radius:12px;width:50px;height:50px;font-size:22px;cursor:pointer;flex:0 0 auto}
.arrow:active{background:#332b4e}
.poolname{flex:1;text-align:center}
.poolname b{display:block;font-size:18px}
.poolname small{color:#8b84a8;font-size:11px}
.odds{display:flex;gap:5px;margin:10px 0}
.odds div{flex:1;text-align:center;font-size:9px;font-weight:800;padding:6px 2px;border-radius:8px;color:#0f0d18;line-height:1.35}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px 0}
@media (max-height:520px){.tile{aspect-ratio:auto;min-height:34px}.card{padding:10px}.grid{gap:5px}}
.tile{aspect-ratio:1;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;text-align:center;line-height:1.1;border:1px solid #2c2644;background:#141120;color:#6a6388;overflow:hidden;padding:3px}
.tile.owned{color:#0f0d18;border-color:transparent}
.tile.secret{background:#241a3a;border:1px dashed #7b5cc4;color:#a98ce8;font-size:16px}
.tile.secret.found{background:linear-gradient(140deg,#9b6fe8,#6d4fc4);border:1px solid #d4b8ff;color:#fff}
.btn{width:100%;border:0;border-radius:13px;padding:15px;font-size:15px;font-weight:800;background:linear-gradient(160deg,#7d5cd8,#5f43b8);color:#fff;cursor:pointer;font-family:inherit;box-shadow:0 4px 0 #3d2a7a}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #3d2a7a}
.btn.off{background:#221d33;color:#5c5578;box-shadow:none;border:1px dashed #332c4d}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.buy{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#141120;border:1px solid #2c2644;border-radius:13px;padding:12px;margin-bottom:8px}
.buy .info{font-size:13px;font-weight:600}
.buy .info small{display:block;color:#8b84a8;font-size:11px;font-weight:400;margin-top:2px}
.buy button{border:0;border-radius:10px;padding:10px 12px;font-weight:800;font-size:12px;background:linear-gradient(160deg,#7d5cd8,#5f43b8);color:#fff;cursor:pointer;font-family:inherit;white-space:nowrap;min-height:40px}
.buy button.off{background:#221d33;color:#5c5578;border:1px dashed #332c4d}
.sec{background:linear-gradient(160deg,#1c1830,#171326);border:1px solid #2c2644;border-radius:16px;margin-bottom:10px;overflow:hidden}
.sec>header{display:flex;justify-content:space-between;align-items:center;padding:14px 15px;cursor:pointer;font-weight:700;font-size:14px;min-height:52px}
.sec>header small{color:#8b84a8;font-weight:400;font-size:12px}
.sec>div{padding:0 15px 15px}
.live{background:#2f7d4f;color:#dfffe9;font-size:9px;padding:2px 7px;border-radius:20px;margin-left:7px;font-weight:800}
.tabs{display:flex;gap:7px;margin-bottom:12px}
.tabs button{flex:1;padding:12px;border-radius:12px;border:1px solid #2c2644;background:#141120;color:#8b84a8;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit}
.tabs button.on{background:linear-gradient(160deg,#7d5cd8,#5f43b8);color:#fff;border-color:#7d5cd8}
.msg{text-align:center;color:#a99ed0;font-size:13px;padding:11px 0 3px;min-height:22px;font-weight:600}
.hint{color:#6f688c;font-size:11px;text-align:center;margin-top:8px;line-height:1.5}
</style>

<body>
<div id="top"></div>
<div id="scroll"></div>
<nav id="nav"></nav>
<script>
var RARITY=[{n:'Common',c:'#9aa0b5'},{n:'Uncommon',c:'#5fbf7a'},{n:'Rare',c:'#5a9ce8'},{n:'Legendary',c:'#e0b23c'},{n:'Mythic',c:'#b06be0'}];
var POOLS=[
 {id:'common',name:'Commons',price:0.05,cap:5,per:0.5,shards:10,odds:[70,22,6,1.9,0.1],
  names:['Pebble','Moss','Dew','Fern','Sprout','Clover','Acorn','Puddle','Twig','Breeze'],secret:null},
 {id:'uncommon',name:'Uncommons',price:0.5,cap:10,per:1,shards:25,odds:[55,30,11,3.5,0.5],
  names:['Quartz','Coral','Thistle','Ember','Willow','Amber','Comet','Basalt','Juniper','Lumen'],secret:null},
 {id:'rare',name:'Rares',price:5,cap:15,per:1.5,shards:60,odds:[35,35,20,8,2],
  names:['Obsidian','Tempest','Aurora','Cinder','Vortex','Prism','Halcyon','Nimbus','Zephyr','Onyx'],secret:null},
 {id:'epic',name:'Epics',price:50,cap:25,per:2.5,shards:150,odds:[10,25,35,25,5],
  names:['Sovereign','Eclipse','Nova','Requiem','Aegis','Paragon','Zenith','Solstice','Vertex','Radiance'],
  secret:{name:'The Hollow Crown',odds:{3:200000,2:100000},pity:{3:40000,2:20000}}},
 {id:'mythic',name:'Mythics',price:500,cap:50,per:5,shards:400,odds:[0,10,30,40,20],
  names:['Genesis','Abyss','Eternity','Oblivion','Ascendant','Celestial','Infinity','Ragnarok','Aether','Apotheosis'],
  secret:{name:'???',odds:{3:40000},pity:{3:8000}}}
];
var SEASONS=[
 {m:0,name:'New Year',secret:'Midnight Spark',names:['Confetti','Countdown','Toast','Ribbon','Firework']},
 {m:1,name:'Lunar New Year',secret:'Golden Dragon',names:['Lantern','Dumpling','Red Envelope','Firecracker','Lucky Coin']},
 {m:2,name:"St. Patrick's Day",secret:'Emerald Leprechaun',names:['Clover','Rainbow','Pot of Gold','Shamrock','Horseshoe']},
 {m:3,name:'Easter',secret:'Painted Egg',names:['Egg Basket','Bunny','Chick','Chocolate','Bloom']},
 {m:4,name:'May Day',secret:'Maypole Dancer',names:['Maypole','May Crown','Blossom','Garland','Meadow']},
 {m:5,name:'Midsummer',secret:'Bonfire Wisp',names:['Bonfire','Solstice Sun','Firefly','Honey','Meadow Rose']},
 {m:6,name:'Independence Day',secret:'Firework Phoenix',names:['Sparkler','Star Banner','Parade','Rocket','Picnic']},
 {m:7,name:'Obon',secret:'Lantern Spirit',names:['Crane','Fan','Bell','Lotus','Paper Lantern']},
 {m:8,name:'Mid-Autumn',secret:'Moon Rabbit',names:['Mooncake','Jade Hare','Moonbeam','Harvest Moon','Koi']},
 {m:9,name:'Halloween',secret:'Pumpkin King',names:['Ghost','Bat','Spider','Broom','Candle']},
 {m:10,name:'Thanksgiving',secret:'Harvest Golem',names:['Turkey','Cornucopia','Scarecrow','Pumpkin Pie','Leaf']},
 {m:11,name:'Christmas',secret:'Snowbound Stag',names:['Mistletoe','Holly','Tinsel','Sleigh','Snow Globe']}
];
var EVENT_PRICE=10, EVENT_SECRET_ODDS=10000, EVENT_SECRET_PITY=2000;
var MULT=[{id:'m1',name:'Coin Doubler',cost:250,mult:2},{id:'m2',name:'Coin Tripler',cost:2500,mult:3},{id:'m3',name:'Coin Quadrupler',cost:25000,mult:4},{id:'m4',name:'Coin Quintupler',cost:250000,mult:5}];
var LUCK=[{id:'l1',name:'Lucky Charm',cost:35},{id:'l2',name:'Four-Leaf Clover',cost:180},{id:'l3',name:'Horseshoe',cost:900},{id:'l4',name:'Star Chart',cost:4500},{id:'l5',name:"Fate's Favour",cost:20000}];
var UPGRADES=[{id:'u1',name:'Shard Doubler',cost:5000,currency:'coins',desc:'x2 shards from duplicates'},{id:'u2',name:'Event Doubler',cost:1000,currency:'shards',desc:'x2 event point income'}];
var SAVE_KEY='coinIdlePools_v2';
var BOOST=1.1;

function blank(){
 return {coins:2,shards:0,eventPoints:10,streak:1,lastGift:0,lastTick:Date.now(),
  pools:{common:{0:1,1:1,2:1,3:1,4:1,6:1},uncommon:{0:1,1:1,2:1}},
  seasons:{10:{2:1,3:1}},pity:{},secretPity:{},seasonPity:{},
  mults:{},luck:{},upgrades:{},coinPulled:{},poolIdx:0,tab:'pools',collTab:'classic',folded:{}};
}
var S=load();
function load(){
 try{
  var raw=localStorage.getItem(SAVE_KEY);
  if(!raw) return blank();
  var o=JSON.parse(raw), b=blank();
  var out=Object.assign(b,o);
  out.pools=o.pools||{}; out.seasons=o.seasons||{};
  if(!out.seasons[10]) out.seasons[10]={};
  if(out.seasons[10][2]===undefined&&out.seasons[10][3]===undefined) out.seasons[10]={2:1,3:1};
  out.pity=o.pity||{}; out.secretPity=o.secretPity||{}; out.seasonPity=o.seasonPity||{};
  out.mults=o.mults||{}; out.luck=o.luck||{}; out.upgrades=o.upgrades||{};
  out.coinPulled=o.coinPulled||{}; out.folded=o.folded||{};
  out.poolIdx=((Math.floor(Number(out.poolIdx)||0)%POOLS.length)+POOLS.length)%POOLS.length;
  if(!POOLS[out.poolIdx]) out.poolIdx=0;
  return out;
 }catch(e){return blank()}
}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}

function poolOwned(p){var m=S.pools[p.id]||{};var n=0;for(var i=0;i<p.names.length;i++) if(m[i]) n++; return n}
function poolSecret(p){return !!(p.secret&&S.pools[p.id]&&S.pools[p.id].secret)}
function poolIncome(p){return Math.min(poolOwned(p)*p.per,p.cap)}
function baseIncome(){var t=0;for(var i=0;i<POOLS.length;i++) t+=poolIncome(POOLS[i]);return t}
function totalIncome(){var m=1;for(var i=0;i<MULT.length;i++) if(S.mults[MULT[i].id]) m*=MULT[i].mult;return baseIncome()*m*BOOST}
function seasonOwned(s){var m=S.seasons[s.m]||{};var n=0;for(var i=0;i<5;i++) if(m[i]) n++; return n}
function seasonSecret(s){return !!(S.seasons[s.m]&&S.seasons[s.m].secret)}
function eventIncome(){var b=1;for(var i=0;i<SEASONS.length;i++){if(seasonOwned(SEASONS[i])>=5) b+=1;if(seasonSecret(SEASONS[i])) b+=1}if(S.upgrades.u2) b*=2;return b}
function luckMult(){return 1+0.1*Object.keys(S.luck).length}
function shardMult(){return S.upgrades.u1?2:1}
function fmt(n){if(n>=1000000) return (n/1000000).toFixed(2)+'M';if(n>=1000) return n.toLocaleString('en-US',{maximumFractionDigits:0});if(n>=1) return n.toFixed(2);return n.toFixed(3)}
function fmtInt(n){return Math.floor(n).toLocaleString('en-US')}
function DUPE(r){return [1,2,5,12,30][r]}

function rollRarity(odds,luck){
 var w=odds.slice();
 if(luck>1){var take=w[0]*0.5*(luck-1);w[0]=Math.max(0,w[0]-take);w[3]+=take*0.7;w[4]+=take*0.3}
 var total=0;for(var i=0;i<w.length;i++) total+=w[i];
 var r=Math.random()*total;
 for(var j=0;j<w.length;j++){r-=w[j];if(r<=0) return j}
 return w.length-1;
}
function secretOddsFor(odds,rar){
 if(odds[rar]!==undefined) return odds[rar];
 var keys=Object.keys(odds).map(Number).sort(function(a,b){return a-b});
 var best=keys[0];
 for(var i=0;i<keys.length;i++) if(Math.abs(keys[i]-rar)<Math.abs(best-rar)) best=keys[i];
 return odds[best];
}
function secretPityFor(pity){
 if(!pity) return 1;
 var keys=Object.keys(pity).map(Number).sort(function(a,b){return a-b});
 if(!keys.length) return 1;
 return pity[keys[0]];
}
function pullPool(p,payShards){
 if(payShards){
  if(!S.coinPulled[p.id]) return {err:'Buy this pool with coins first'};
  if(S.shards<p.shards) return {err:'Not enough shards'};
  S.shards-=p.shards;
 }else{
  if(S.coins<p.price) return {err:'Not enough coins'};
  S.coins-=p.price; S.coinPulled[p.id]=true;
 }
 var rar=rollRarity(p.odds,luckMult());
 if(p.secret){
  S.secretPity[p.id]=(S.secretPity[p.id]||0)+1;
  var need=secretPityFor(p.pity);
  var forced=S.secretPity[p.id]>=need;
  var hit=forced||Math.random()<1/secretOddsFor(p.secret.odds,rar);
  if(hit){
   S.pools[p.id]=S.pools[p.id]||{};
   if(!S.pools[p.id].secret){
    S.pools[p.id].secret=true; S.secretPity[p.id]=0; save(); render();
    return {secret:true,name:p.secret.name,rarity:rar};
   }
  }
 }
 var idx=rar*2+Math.floor(Math.random()*2);
 S.pools[p.id]=S.pools[p.id]||{};
 var isNew=!S.pools[p.id][idx];
 if(isNew) S.pools[p.id][idx]=1; else S.shards+=DUPE(rar)*shardMult();
 save(); render();
 return {name:p.names[idx],rarity:rar,isNew:isNew};
}
function pullEvent(){
 if(S.eventPoints<EVENT_PRICE) return {err:'Not enough event points'};
 S.eventPoints-=EVENT_PRICE;
 var month=new Date().getMonth(), s=SEASONS[month];
 var rar=rollRarity([70,22,6,1.9,0.1],luckMult());
 S.seasonPity[month]=(S.seasonPity[month]||0)+1;
 var forced=S.seasonPity[month]>=EVENT_SECRET_PITY;
 if(forced||Math.random()<1/EVENT_SECRET_ODDS){
  S.seasons[month]=S.seasons[month]||{};
  if(!S.seasons[month].secret){
   S.seasons[month].secret=true; S.seasonPity[month]=0; save(); render();
   return {secret:true,name:s.secret,rarity:rar};
  }
 }
 var local=Math.floor(Math.random()*5);
 S.seasons[month]=S.seasons[month]||{};
 var isNew=!S.seasons[month][local];
 if(isNew) S.seasons[month][local]=1; else S.shards+=DUPE(rar)*shardMult();
 save(); render();
 return {name:s.names[local],rarity:rar,isNew:isNew};
}

var lastFrame=Date.now();
function tick(){
  var now=Date.now();
  var dt=Math.min((now-lastFrame)/1000,86400);
  lastFrame=now;
  S.coins+=totalIncome()/86400*dt;
  S.eventPoints+=eventIncome()/86400*dt;
  S.lastTick=now;
  var c=document.getElementById('coinStat'); if(c) c.textContent=fmt(S.coins);
  var e=document.getElementById('eventStat'); if(e) e.textContent=fmtInt(S.eventPoints);
}
setInterval(tick,300);
// Save regularly: Android may kill a background tab without firing pagehide.
setInterval(save,5000);

function todayKey(){var d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
function giftAvailable(){return S.lastGift!==todayKey()}
function giftAmount(){return 0.10*(1+0.35*Math.min(S.streak,29))}
function claimGift(){
 if(!giftAvailable()) return;
 var t=todayKey();
 var y=new Date(Date.now()-86400000);
 var yk=y.getFullYear()*10000+(y.getMonth()+1)*100+y.getDate();
 S.streak=(S.lastGift===yk)?S.streak+1:1;
 S.lastGift=t; S.coins+=giftAmount(); S.eventPoints+=1;
 save(); render();
}

var topEl=document.getElementById('top'), scrollEl=document.getElementById('scroll'), navEl=document.getElementById('nav');

function tiles(p){
 var out='';
 for(var i=0;i<p.names.length;i++){
  var rar=Math.floor(i/2), owned=S.pools[p.id]&&S.pools[p.id][i];
  out+= owned ? '<div class="tile owned" style="background:'+RARITY[rar].c+'">'+p.names[i][0]+'</div>'
              : '<div class="tile">'+p.names[i][0]+'</div>';
 }
 if(p.secret){
  var f=poolSecret(p);
  out+='<div class="tile secret'+(f?' found':'')+'">'+(f?'&#10022;':'?')+'</div>';
 }
 return out;
}
function eventTiles(month){
 var s=SEASONS[month], out='';
 for(var i=0;i<5;i++){
  var owned=S.seasons[month]&&S.seasons[month][i];
  out+= owned ? '<div class="tile owned" style="background:'+RARITY[i].c+'">'+s.names[i][0]+'</div>'
              : '<div class="tile">'+s.names[i][0]+'</div>';
 }
 var f=seasonSecret(s);
 out+='<div class="tile secret'+(f?' found':'')+'">'+(f?'&#10022;':'?')+'</div>';
 return out;
}
function countdown(){
 var now=new Date(), end=new Date(now.getFullYear(),now.getMonth()+1,1,0,0,0);
 var ms=end-now;
 return Math.floor(ms/86400000)+'d '+Math.floor(ms/3600000)%24+'h '+Math.floor(ms/60000)%60+'m';
}

function render(){
 var pi=Math.floor(Number(S.poolIdx)||0);
 S.poolIdx=((pi%POOLS.length)+POOLS.length)%POOLS.length;
 var p=POOLS[S.poolIdx];
 topEl.innerHTML='<h1>Coin Idle: Gacha Pools</h1><div class="top">'+
  '<div><div class="stat" id="coinStat">'+fmt(S.coins)+'</div><div class="sub">'+fmt(totalIncome())+' / day</div></div>'+
  '<div class="right"><div class="stat">'+fmtInt(S.shards)+'</div><div class="sub">shards</div>'+
  '<div class="sub" style="margin-top:5px"><span id="eventStat">'+fmtInt(S.eventPoints)+'</span> event pts</div></div></div>';

 var h='';
 if(S.tab==='pools'){
  h+='<div class="card"><div class="carousel">'+
   '<button class="arrow" onclick="movePool(-1)">&#8249;</button>'+
   '<div class="poolname"><b>'+p.name+'</b><small>'+fmt(p.price)+' coins / pull</small></div>'+
   '<button class="arrow arrow-r" onclick="movePool(1)">&#8250;</button></div>'+
   '<div class="row"><span>Owned</span><span>'+poolOwned(p)+' / '+p.names.length+'</span></div>'+
   '<div class="row"><span>Pool income</span><span>'+poolIncome(p).toFixed(2)+' / day <small style="color:#6f688c">(cap '+p.cap+')</small></span></div>';
  if(p.secret) h+='<div class="row"><span>Secret pity</span><span>'+fmtInt(S.secretPity[p.id]||0)+' / '+fmtInt(secretPityFor(p.pity))+'</span></div>';
  h+='<div class="odds">';
  for(var i=0;i<p.odds.length;i++) h+='<div style="background:'+RARITY[i].c+'">'+RARITY[i].n.slice(0,4).toUpperCase()+'<br>'+p.odds[i]+'%</div>';
  h+='</div><div class="grid">'+tiles(p)+'</div>'+
   '<div class="btns"><button class="btn pull-coin'+(S.coins<p.price?' off':'')+'" onclick="doPull(false)">PULL &mdash; '+fmt(p.price)+' coins</button>'+
   '<button class="btn'+(S.coinPulled[p.id]&&S.shards>=p.shards?'':' off')+'" onclick="doPull(true)">'+(S.coinPulled[p.id]?'PULL &mdash; '+p.shards+' shards':'COIN PULL FIRST')+'</button></div>'+
   '<div class="msg" id="msg">Pull to see what you get</div></div>';
 }
 if(S.tab==='event'){
  var m=new Date().getMonth(), s=SEASONS[m];
  h+='<div class="card"><div class="poolname" style="margin-bottom:10px"><b>'+s.name+'</b><small>'+EVENT_PRICE+' event points / pull</small></div>'+
   '<div class="row"><span>Ends in</span><span>'+countdown()+'</span></div>'+
   '<div class="row"><span>Owned</span><span>'+seasonOwned(s)+' / 5</span></div>'+
   '<div class="row"><span>Secret</span><span>'+(seasonSecret(s)?s.secret:'???')+'</span></div>'+
   '<div class="row"><span>Secret pity</span><span>'+fmtInt(S.seasonPity[m]||0)+' / '+fmtInt(EVENT_SECRET_PITY)+'</span></div>'+
   '<div class="row"><span>Event income</span><span>'+eventIncome()+' / day</span></div>'+
   '<div class="grid">'+eventTiles(m)+'</div>'+
   '<button class="btn'+(S.eventPoints<EVENT_PRICE?' off':'')+'" onclick="doEvent()">PULL &mdash; '+EVENT_PRICE+' event points</button>'+
   '<div class="msg" id="msg">Pool changes on the 1st of each month</div></div>';
 }
 if(S.tab==='collection'){
  h+='<div class="tabs"><button class="'+(S.collTab==='classic'?'on':'')+'" onclick="setColl(\'classic\')">Classic</button>'+
   '<button class="'+(S.collTab==='seasonal'?'on':'')+'" onclick="setColl(\'seasonal\')">Seasonal</button></div>';
  if(S.collTab==='classic'){
   for(var a=0;a<POOLS.length;a++){
    var pp=POOLS[a], k='c'+pp.id, open=!S.folded[k];
    h+='<div class="sec"><header onclick="fold(\''+k+'\')"><span>'+pp.name+'</span><span><small>'+poolOwned(pp)+'/'+pp.names.length+'</small> '+(open?'&#9662;':'&#9656;')+'</span></header>';
    if(open) h+='<div><div class="grid">'+tiles(pp)+'</div></div>';
    h+='</div>';
   }
  }else{
   var now=new Date().getMonth();
   for(var b2=0;b2<SEASONS.length;b2++){
    var ss=SEASONS[b2], kk='s'+ss.m, op=!S.folded[kk];
    h+='<div class="sec"><header onclick="fold(\''+kk+'\')"><span>'+ss.name+(ss.m===now?'<span class="live">LIVE</span>':'')+'</span><span><small>'+seasonOwned(ss)+'/5</small> '+(op?'&#9662;':'&#9656;')+'</span></header>';
    if(op) h+='<div><div class="grid">'+eventTiles(ss.m)+'</div></div>';
    h+='</div>';
   }
  }
 }
 if(S.tab==='shop'){
  h+='<div class="card"><div class="row" style="font-weight:800;color:#fff;font-size:14px"><span>Coin Multipliers</span><span></span></div>';
  for(var c1=0;c1<MULT.length;c1++){
   var x=MULT[c1], own=!!S.mults[x.id], can=S.coins>=x.cost;
   h+='<div class="buy"><div class="info">'+x.name+'<small>x'+x.mult+' all pool income</small></div>'+
    '<button class="'+(own||!can?'off':'')+'" onclick="buyMult(\''+x.id+'\')">'+(own?'OWNED':fmt(x.cost)+' coins')+'</button></div>';
  }
  h+='</div><div class="card"><div class="row" style="font-weight:800;color:#fff;font-size:14px"><span>Luck Upgrades</span><span></span></div>';
  for(var c2=0;c2<LUCK.length;c2++){
   var y=LUCK[c2], own2=!!S.luck[y.id], can2=S.coins>=y.cost;
   h+='<div class="buy"><div class="info">'+y.name+'<small>+10% luck</small></div>'+
    '<button class="'+(own2||!can2?'off':'')+'" onclick="buyLuck(\''+y.id+'\')">'+(own2?'OWNED':fmt(y.cost)+' coins')+'</button></div>';
  }
  h+='<div class="hint">Current luck: x'+luckMult().toFixed(1)+'</div></div>';
  h+='<div class="card"><div class="row" style="font-weight:800;color:#fff;font-size:14px"><span>Special Upgrades</span><span></span></div>';
  for(var c3=0;c3<UPGRADES.length;c3++){
   var z=UPGRADES[c3], own3=!!S.upgrades[z.id];
   var can3=z.currency==='coins'?S.coins>=z.cost:S.shards>=z.cost;
   h+='<div class="buy"><div class="info">'+z.name+'<small>'+z.desc+'</small></div>'+
    '<button class="'+(own3||!can3?'off':'')+'" onclick="buyUpgrade(\''+z.id+'\')">'+(own3?'OWNED':fmtInt(z.cost)+' '+(z.currency==='coins'?'coins':'shards'))+'</button></div>';
  }
  h+='</div>';
 }
 if(S.tab==='daily'){
  h+='<div class="card"><div class="row"><span>Streak</span><span>'+S.streak+' day'+(S.streak===1?'':'s')+'</span></div>'+
   '<div class="row"><span>Today&rsquo;s gift</span><span>'+giftAmount().toFixed(2)+' coins + 1 event pt</span></div>'+
   '<button class="btn'+(giftAvailable()?'':' off')+'" onclick="claimGift()">'+(giftAvailable()?'CLAIM GIFT':'CLAIMED TODAY')+'</button>'+
   '<div class="hint">Miss a day and the streak resets to day 1.</div></div>';
 }
 scrollEl.innerHTML=h;

 var tabs=[['pools','Pools'],['event','Event'],['collection','Collection'],['shop','Shop'],['daily','Daily']], nh='';
 for(var t=0;t<tabs.length;t++){
  nh+='<button class="'+(S.tab===tabs[t][0]?'on':'')+'" onclick="setTab(\''+tabs[t][0]+'\')">'+tabs[t][1]+
   (tabs[t][0]==='daily'&&giftAvailable()?'<span class="dot"></span>':'')+'</button>';
 }
 navEl.innerHTML=nh;
}

function setTab(t){S.tab=t;save();render()}
function setColl(t){S.collTab=t;save();render()}
function fold(k){S.folded[k]=!S.folded[k];save();render()}
function movePool(d){var i=Math.floor(Number(S.poolIdx)||0);i=((i+d)%POOLS.length+POOLS.length)%POOLS.length;S.poolIdx=i;save();render()}
function buyMult(id){var x=null;for(var i=0;i<MULT.length;i++) if(MULT[i].id===id) x=MULT[i];if(!x||S.mults[id]||S.coins<x.cost) return;S.coins-=x.cost;S.mults[id]=true;save();render()}
function buyLuck(id){var x=null;for(var i=0;i<LUCK.length;i++) if(LUCK[i].id===id) x=LUCK[i];if(!x||S.luck[id]||S.coins<x.cost) return;S.coins-=x.cost;S.luck[id]=true;save();render()}
function buyUpgrade(id){var x=null;for(var i=0;i<UPGRADES.length;i++) if(UPGRADES[i].id===id) x=UPGRADES[i];if(!x||S.upgrades[id]) return;if(x.currency==='coins'){if(S.coins<x.cost) return;S.coins-=x.cost}else{if(S.shards<x.cost) return;S.shards-=x.cost}S.upgrades[id]=true;save();render()}
function doPull(shards){
 var res=pullPool(POOLS[S.poolIdx],shards), el=document.getElementById('msg');
 if(!el) return;
 if(res.err){el.textContent=res.err;return}
 if(res.secret){el.innerHTML='&#10022; SECRET &mdash; <b style="color:#c9a8ff">'+res.name+'</b> &#10022;';return}
 el.innerHTML=(res.isNew?'NEW &mdash; ':'Duplicate &mdash; ')+'<b style="color:'+RARITY[res.rarity].c+'">'+res.name+'</b>';
}
function doEvent(){
 var res=pullEvent(), el=document.getElementById('msg');
 if(!el) return;
 if(res.err){el.textContent=res.err;return}
 if(res.secret){el.innerHTML='&#10022; SECRET &mdash; <b style="color:#c9a8ff">'+res.name+'</b> &#10022;';return}
 el.innerHTML=(res.isNew?'NEW &mdash; ':'Duplicate &mdash; ')+'<b style="color:'+RARITY[res.rarity].c+'">'+res.name+'</b>';
}

(function(){
 var now=Date.now();
 var away=Math.min((now-S.lastTick)/1000,86400);
 if(away>5){S.coins+=totalIncome()/86400*away;S.eventPoints+=eventIncome()/86400*away}
 S.lastTick=now; save();
})();
window.addEventListener('pagehide',save);
document.addEventListener('visibilitychange',function(){if(document.hidden) save()});
render();
</script>

</body></html>
